name: Temporary Spatial Studio Cargo cache export

on:
  push:
    branches:
      - tmp/export-rust-toolchain-20260830
    paths:
      - .github/workflows/export-spatial-studio-cargo-cache.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Resolve and package dependency cache
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd
          WORK=$(mktemp -d)
          cat > "$WORK/Cargo.toml" <<'TOML'
          [package]
          name = "spatial-studio-cache-seed"
          version = "0.1.0"
          edition = "2024"

          [dependencies]
          anyhow = "1.0"
          clap = { version = "4.5", features = ["derive"] }
          flate2 = "1.1"
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          serde_yaml = "0.9"
          sha2 = "0.10"
          tar = "0.4"
          tempfile = "3.20"
          thiserror = "2.0"
          walkdir = "2.5"
          zip = { version = "2.4", default-features = false, features = ["deflate"] }
          TOML
          mkdir -p "$WORK/src"
          printf 'fn main() {}\n' > "$WORK/src/main.rs"
          cargo fetch --manifest-path "$WORK/Cargo.toml"
          cargo build --manifest-path "$WORK/Cargo.toml"
          mkdir -p /tmp/spatial-studio-cargo-cache
          cp -a "$HOME/.cargo/registry" /tmp/spatial-studio-cargo-cache/
          if [[ -d "$HOME/.cargo/git" ]]; then cp -a "$HOME/.cargo/git" /tmp/spatial-studio-cargo-cache/; fi
          cp "$WORK/Cargo.lock" /tmp/spatial-studio-cargo-cache/cache-seed-Cargo.lock
          cargo metadata --manifest-path "$WORK/Cargo.toml" --format-version 1 > /tmp/spatial-studio-cargo-cache/metadata.json
          tar --zstd -C /tmp -cf spatial-studio-cargo-cache.tar.zst spatial-studio-cargo-cache
          sha256sum spatial-studio-cargo-cache.tar.zst > spatial-studio-cargo-cache.tar.zst.sha256
          ls -lh spatial-studio-cargo-cache.tar.zst
      - name: Upload Cargo cache
        uses: actions/upload-artifact@v4
        with:
          name: spatial-studio-cargo-cache
          path: |
            spatial-studio-cargo-cache.tar.zst
            spatial-studio-cargo-cache.tar.zst.sha256
          retention-days: 1
          compression-level: 0
