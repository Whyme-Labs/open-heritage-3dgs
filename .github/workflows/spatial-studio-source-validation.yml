name: Temporary Spatial Studio source validation

on:
  push:
    branches:
      - tmp/spatial-studio-ci-20260829
    paths:
      - .github/workflows/spatial-studio-source-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Materialize source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/spatial-studio.tar.gz.b64 <<'B64'
          [... ELLIPSIZATION ...]
          B64
          base64 --decode /tmp/spatial-studio.tar.gz.b64 > /tmp/spatial-studio.tar.gz
          tar -xzf /tmp/spatial-studio.tar.gz -C /tmp
          test -f /tmp/spatial-validate/Cargo.toml

      - name: Install Rust quality components
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Format
        working-directory: /tmp/spatial-validate
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: /tmp/spatial-validate
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: /tmp/spatial-validate
        run: cargo test --workspace

      - name: CLI smoke tests
        working-directory: /tmp/spatial-validate
        run: |
          cargo run -p spatial-cli -- poses build \
            --trajectory examples/trajectory.json \
            --frames examples/frame-times.json \
            --mount examples/body-from-camera.json \
            --output /tmp/frame-poses.json
          cargo run -p spatial-cli -- camera validate \
            --intrinsics examples/pinhole-intrinsics.json \
            --poses /tmp/frame-poses.json \
            --samples examples/reprojection-samples.json \
            --strict
