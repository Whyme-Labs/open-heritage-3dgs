name: Temporary Spatial Studio source validation

on:
  push:
    branches:
      - tmp/spatial-studio-ci-20260829
    paths:
      - .github/workflows/spatial-studio-source-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Materialize exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .validation/spatial-studio/source.part.* > /tmp/spatial-studio.tar.gz.b64
          echo '0197ad705f04964e0165bb0f7a5123c2a18f87538ec16248120ecec67d4c30ac  /tmp/spatial-studio.tar.gz.b64' | sha256sum -c -
          base64 --decode /tmp/spatial-studio.tar.gz.b64 > /tmp/spatial-studio.tar.gz
          echo '07c97c7a046bdedbe46e7e6478486592cae54d1a0db1b79c3d3c7b686d5b3a15  /tmp/spatial-studio.tar.gz' | sha256sum -c -
          tar -xzf /tmp/spatial-studio.tar.gz -C /tmp
          test -f /tmp/spatial-validate/Cargo.toml

      - name: Install Rust quality components
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Format
        working-directory: /tmp/spatial-validate
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: /tmp/spatial-validate
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: /tmp/spatial-validate
        run: cargo test --workspace

      - name: CLI smoke tests
        working-directory: /tmp/spatial-validate
        run: |
          cargo run -p spatial-cli -- poses build \
            --trajectory examples/trajectory.json \
            --frames examples/frame-times.json \
            --mount examples/body-from-camera.json \
            --output /tmp/frame-poses.json
          cargo run -p spatial-cli -- camera validate \
            --intrinsics examples/pinhole-intrinsics.json \
            --poses /tmp/frame-poses.json \
            --samples examples/reprojection-samples.json \
            --strict
